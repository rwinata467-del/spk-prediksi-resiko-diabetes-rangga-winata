<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cek Risiko Diabetes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFFFFF;--ink:#161A23;--mut:#6B7280;--line:#E1E4EB;--low:#0B8A7B;--high:#D93D42;--on:#fff;
--s1:#D4E7FF;--s1ink:#0F2547;--s1mut:#42618F;--s1ac:#2B3CC8;--s1on:#fff;--s1seg:#EEF2FF;--s1tr:#D3DAF3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1117;--ink:#EDEFF4;--mut:#98A1B3;--line:#252B38;--low:#2CC4AF;--high:#FF6B6F;--on:#0E1117;--s1:#14284A;--s1ink:#EAF1FF;--s1mut:#9DB4DA;--s1ac:#8FB0FF;--s1on:#0F2547;--s1seg:rgba(255,255,255,.1);--s1tr:rgba(255,255,255,.25)}}
:root[data-theme="dark"]{--bg:#0E1117;--ink:#EDEFF4;--mut:#98A1B3;--line:#252B38;--low:#2CC4AF;--high:#FF6B6F;--on:#0E1117;--s1:#14284A;--s1ink:#EAF1FF;--s1mut:#9DB4DA;--s1ac:#8FB0FF;--s1on:#0F2547;--s1seg:rgba(255,255,255,.1);--s1tr:rgba(255,255,255,.25)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.45}
.vp{overflow:hidden;transition:height .3s ease}
.tr{display:flex;width:200%;align-items:flex-start;transition:transform .35s ease}
@media(prefers-reduced-motion:reduce){.tr,.vp{transition:none}}
.sl{flex:0 0 50%;min-width:0;min-height:100vh;min-height:100svh}
#s0{background:var(--bg);color:var(--ink);--nb:var(--s1seg);--na:var(--s1ac);--nt:var(--s1on)}
#s1{background:var(--bg);color:var(--ink);--nb:var(--s1seg);--na:var(--s1ac);--nt:var(--s1on)}
.in{max-width:820px;margin:0 auto;padding:20px 18px 48px}
.nv{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.bn{font-size:1.1rem;font-weight:800}
.tabs{display:flex;background:var(--nb);border-radius:999px;padding:3px}
.tab{border:0;background:transparent;color:inherit;padding:7px 16px;border-radius:999px;font:inherit;font-weight:500;display:flex;gap:8px;align-items:center;cursor:pointer}
.tab i{font-style:normal;display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--nb);font-size:.78rem}
.tab.on{background:var(--na);color:var(--nt);font-weight:700}
.tab.on i{background:rgba(255,255,255,.25)}
.tab:focus-visible,.go:focus-visible,.alt:focus-visible,.seg button:focus-visible{outline:2px solid var(--na);outline-offset:2px}
@media(max-width:560px){.tabs{width:100%}.tab{flex:1;justify-content:center}}
h2{font-size:clamp(1.8rem,5vw,2.6rem);font-weight:800;margin:30px 0 24px;outline:0;line-height:1.1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.fg{display:grid;gap:4px 44px;grid-template-columns:1fr;margin-bottom:6px}
@media(min-width:700px){.fg{grid-template-columns:1fr 1fr}}
.fld{margin-bottom:20px}
.row{display:flex;justify-content:space-between;align-items:baseline}
.row label,.lb{font-size:.95rem;color:var(--mut)}
output{font-size:1.25rem;font-weight:700;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;background:var(--s1tr);border-radius:2px;margin:14px 0 6px;display:block}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--s1ac);border:0;cursor:pointer}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--s1ac);border:0;cursor:pointer}
input[type=range]:focus-visible{outline:2px solid var(--s1ac);outline-offset:8px}
.seg{display:flex;gap:4px;background:var(--s1seg);padding:4px;border-radius:12px;margin-top:8px}
.seg button{flex:1;border:0;background:transparent;color:var(--ink);padding:9px 4px;border-radius:9px;font:inherit;font-weight:500;cursor:pointer}
.seg button.on{background:var(--s1ac);color:var(--s1on);font-weight:700}
.sw{position:relative;display:flex;gap:14px;align-items:center;cursor:pointer;width:max-content}
.sw input{position:absolute;opacity:0}
.sw i{width:44px;height:26px;border-radius:13px;background:var(--s1tr);position:relative;transition:background .15s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.sw input:checked+i{background:var(--s1ac)}
.sw input:checked+i::after{transform:translateX(18px)}
.sw input:focus-visible+i{outline:2px solid var(--s1ac);outline-offset:3px}
.go,.alt{width:100%;padding:14px;border-radius:12px;font:inherit;font-size:1.1rem;font-weight:800;cursor:pointer}
.go{margin-top:28px;border:0;background:var(--s1ac);color:var(--s1on)}
.alt{border:2px solid var(--s1ac);background:transparent;color:var(--s1ac)}
#s1 .in>*+*{margin-top:30px}
.r{display:block;font-size:1.4rem;font-weight:500;color:var(--mut)}
.w{display:block;font-size:clamp(4.5rem,14vw,8.5rem);font-weight:800;line-height:.95;letter-spacing:-.03em}
.sub{margin:10px 0 14px;color:var(--mut)}
.bl{display:flex;gap:6px;flex-wrap:wrap}
.blk{min-width:52px;padding:9px 12px;border-radius:8px;color:var(--on);font-weight:700;font-size:.9rem;text-align:center}
.blk.lo{background:var(--low)}.blk.hi{background:var(--high)}
svg.pl{width:100%;height:auto;display:block}
svg text{font-family:inherit}
.ax{font-size:13px;fill:var(--mut)}
.pt{font-size:13px;font-weight:700;fill:var(--ink)}
.gl{stroke:var(--line)}
.ln{stroke:var(--ink);stroke-dasharray:4 4;opacity:.5}
circle.lo{fill:var(--low)}circle.hi{fill:var(--high)}
circle.nr{stroke:var(--ink);stroke-width:2}
.far{opacity:.4}
.nw{fill:var(--ink)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem;font-variant-numeric:tabular-nums}
th,td{padding:9px 14px 9px 0;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mut);font-weight:500}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px}
.dot.lo{background:var(--low)}.dot.hi{background:var(--high)}
</style>
</head>
<body>
<div class="vp" id="vp"><div class="tr" id="tr">
  <section class="sl" id="s0"><div class="in">
    <h2 tabindex="-1">Data pasien</h2>
    <div class="fg" id="sli"></div>
    <div class="fg">
      <div class="fld"><div class="lb">Riwayat keluarga</div><div class="seg" id="riw" role="group" aria-label="Riwayat keluarga"></div></div>
      <div class="fld"><div class="lb">Jumlah tetangga (K)</div><div class="seg" id="kk" role="group" aria-label="Jumlah tetangga"></div></div>
    </div>
    <label class="sw"><input id="norm" type="checkbox"><i></i><span>Normalisasi</span></label>
    <button id="go" class="go" type="button">Prediksi</button>
  </div></section>
  <section class="sl" id="s1" aria-live="polite"><div class="in">
    <h2 class="sr" tabindex="-1">Hasil prediksi</h2>
    <div id="res"></div>
    <svg id="plot" class="pl" viewBox="0 0 520 340" role="img" aria-label="Sebaran pasien berdasarkan BMI dan glukosa"></svg>
    <div class="tw"><table id="tab"></table></div>
    <button id="back" class="alt" type="button">Ubah data</button>
  </div></section>
</div></div>

<script>
const DATA=[["P01",25,21.5,90,110,0,0],["P02",30,23.1,95,115,0,0],["P03",35,25.0,105,120,0,0],["P04",40,27.5,120,125,1,1],["P05",45,30.2,140,135,1,1],["P06",50,31.5,155,140,1,1],["P07",55,33.0,165,145,1,1],["P08",28,22.5,92,112,0,0],["P09",38,26.8,115,122,0,0],["P10",48,29.5,145,130,1,1]];
const LBL=["Rendah","Tinggi"], CLS=["lo","hi"];
const $=id=>document.getElementById(id);
const S={usia:42,bmi:28.5,glukosa:130,tekanan:128,riw:1,k:3,norm:false};
const SL=[["usia","Usia",18,80,1," th"],["bmi","BMI",15,45,0.1,""],["glukosa","Glukosa",60,220,1," mg/dL"],["tekanan","Tekanan darah",90,180,1," mmHg"]];
const fmt=(id,v)=>(id==="bmi"?v.toFixed(1):v);
const vp=$("vp"), tr=$("tr"), sl=[$("s0"),$("s1")];
let cur=0;

const nav=n=>`<div class="nv"><b class="bn">Cek Risiko Diabetes</b><div class="tabs">${["Data","Hasil"].map((t,i)=>`<button type="button" class="tab${i===n?" on":""}" data-go="${i}"${i===n?' aria-current="step"':""}><i>${i+1}</i>${t}</button>`).join("")}</div></div>`;
document.querySelectorAll(".in").forEach((el,i)=>el.insertAdjacentHTML("afterbegin",nav(i)));

const fit=()=>{vp.style.height=sl[cur].offsetHeight+"px"};
const ro=new ResizeObserver(fit); sl.forEach(s=>ro.observe(s));
function show(n,focus=true){
  cur=n;
  tr.style.transform=`translateX(${-50*n}%)`;
  sl.forEach((s,i)=>s.inert=i!==n);
  fit();
  if(focus){window.scrollTo(0,0);sl[n].querySelector("h2").focus({preventScroll:true});}
}

$("sli").innerHTML=SL.map(([id,n,mn,mx,st,u])=>`<div class="fld"><div class="row"><label for="${id}">${n}</label><output id="o_${id}">${fmt(id,S[id])}${u}</output></div><input id="${id}" type="range" min="${mn}" max="${mx}" step="${st}" value="${S[id]}"></div>`).join("");
SL.forEach(([id,,,,,u])=>$(id).addEventListener("input",e=>{S[id]=+e.target.value;$("o_"+id).textContent=fmt(id,S[id])+u;}));

function seg(el,opts,key){
  el.innerHTML=opts.map(([v,t])=>`<button type="button" data-v="${v}">${t}</button>`).join("");
  const mark=()=>[...el.children].forEach(b=>{const on=+b.dataset.v===S[key];b.classList.toggle("on",on);b.setAttribute("aria-pressed",on)});
  el.onclick=e=>{const b=e.target.closest("button");if(!b)return;S[key]=+b.dataset.v;mark();};
  mark();
}
seg($("riw"),[[1,"Ada"],[0,"Tidak ada"]],"riw");
seg($("kk"),[1,3,5,7,9].map(n=>[n,n]),"k");
$("norm").onchange=e=>{S.norm=e.target.checked;};

const tk=(a,b,s)=>{const o=[];for(let v=Math.ceil(a/s)*s;v<=b;v+=s)o.push(v);return o};

function draw(P){
  const k=P.k, baru=[P.usia,P.bmi,P.glukosa,P.tekanan,P.riw], X=DATA.map(r=>r.slice(1,6)), J=[0,1,2,3,4];
  const lo=J.map(j=>Math.min(...X.map(r=>r[j]))), hi=J.map(j=>Math.max(...X.map(r=>r[j])));
  const sc=(v,j)=>P.norm?(v-lo[j])/(hi[j]-lo[j]):v;
  const rows=DATA.map((r,i)=>({r,d:Math.hypot(...J.map(j=>sc(X[i][j],j)-sc(baru[j],j)))})).sort((a,b)=>a.d-b.d);
  const nn=rows.slice(0,k), tg=nn.filter(x=>x.r[6]).length, pred=tg*2>k?1:0, menang=pred?tg:k-tg;

  $("res").innerHTML=`<span class="r">Risiko</span><span class="w" style="color:var(--${pred?"high":"low"})">${LBL[pred]}</span><p class="sub">${menang} dari ${k} tetangga terdekat</p><div class="bl">${nn.map(x=>`<span class="blk ${CLS[x.r[6]]}">${x.r[0]}</span>`).join("")}</div>`;

  const W=520,H=340,m={l:44,r:16,t:26,b:46};
  const xs=[...DATA.map(r=>r[2]),P.bmi], ys=[...DATA.map(r=>r[3]),P.glukosa];
  const x0=Math.min(...xs)-1.5,x1=Math.max(...xs)+1.5,y0=Math.min(...ys)-10,y1=Math.max(...ys)+10;
  const px=v=>m.l+(v-x0)/(x1-x0)*(W-m.l-m.r), py=v=>H-m.b-(v-y0)/(y1-y0)*(H-m.t-m.b);
  let g=tk(y0,y1,20).map(v=>`<line x1="${m.l}" x2="${W-m.r}" y1="${py(v)}" y2="${py(v)}" class="gl"/><text x="${m.l-8}" y="${py(v)+4}" text-anchor="end" class="ax">${v}</text>`).join("");
  g+=tk(x0,x1,5).map(v=>`<text x="${px(v)}" y="${H-26}" text-anchor="middle" class="ax">${v}</text>`).join("");
  g+=`<text x="${(m.l+W-m.r)/2}" y="${H-6}" text-anchor="middle" class="ax">BMI</text><text x="${m.l-8}" y="12" class="ax">Glukosa</text>`;
  g+=`<circle cx="${W-190}" cy="9" r="5" class="lo"/><text x="${W-181}" y="13" class="ax">Rendah</text><circle cx="${W-118}" cy="9" r="5" class="hi"/><text x="${W-109}" y="13" class="ax">Tinggi</text><rect x="${W-48}" y="4" width="10" height="10" transform="rotate(45 ${W-43} 9)" class="nw"/><text x="${W-32}" y="13" class="ax">Baru</text>`;
  g+=nn.map(x=>`<line x1="${px(P.bmi)}" y1="${py(P.glukosa)}" x2="${px(x.r[2])}" y2="${py(x.r[3])}" class="ln"/>`).join("");
  g+=rows.map((x,i)=>{const n=i<k;return `<circle cx="${px(x.r[2])}" cy="${py(x.r[3])}" r="${n?8:6}" class="${CLS[x.r[6]]} ${n?"nr":"far"}"/>`+(n?`<text x="${px(x.r[2])+12}" y="${py(x.r[3])+4}" class="pt">${x.r[0]}</text>`:"")}).join("");
  g+=`<rect x="${px(P.bmi)-8}" y="${py(P.glukosa)-8}" width="16" height="16" transform="rotate(45 ${px(P.bmi)} ${py(P.glukosa)})" class="nw"/>`;
  $("plot").innerHTML=g;

  $("tab").innerHTML="<tr><th>Pasien</th><th>Usia</th><th>BMI</th><th>Glukosa</th><th>Tek. darah</th><th>Riwayat</th><th>Jarak</th></tr>"+rows.map((x,i)=>`<tr class="${i<k?"":"far"}"><td><i class="dot ${CLS[x.r[6]]}"></i>${x.r[0]}</td><td>${x.r[1]}</td><td>${x.r[2]}</td><td>${x.r[3]}</td><td>${x.r[4]}</td><td>${x.r[5]?"Ada":"Tidak"}</td><td>${x.d.toFixed(3)}</td></tr>`).join("");
}

function predict(){draw({...S});show(1);}
$("go").onclick=predict; $("back").onclick=()=>show(0);
document.addEventListener("click",e=>{const b=e.target.closest("[data-go]");if(!b)return;+b.dataset.go?predict():show(0);});

let x0=null;
document.addEventListener("touchstart",e=>{x0=e.target.closest(".tw,input[type=range]")?null:e.touches[0].clientX},{passive:true});
document.addEventListener("touchend",e=>{
  if(x0===null)return;
  const dx=e.changedTouches[0].clientX-x0; x0=null;
  if(dx>70&&cur===1)show(0); else if(dx<-70&&cur===0)predict();
},{passive:true});

show(0,false);
</script>
</body>
</html>
